<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Subscription Box Manager</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef2ff,#f8fafc);font-family:Arial,sans-serif;color:#172033}
    .card{width:min(100%,430px);background:#fff;padding:34px;border-radius:18px;box-shadow:0 16px 45px #1e293b18}
    h1{margin:0 0 8px;font-size:27px}.sub{color:#64748b;margin:0 0 25px;line-height:1.5}
    label{display:block;font-size:14px;font-weight:600;margin:16px 0 7px}
    input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;outline:none}
    input:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f120}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    .foot{text-align:center;margin:22px 0 0;color:#64748b;font-size:14px}a{color:#4f46e5;text-decoration:none;font-weight:600}
    .notice{margin:0 0 17px;padding:11px;border-radius:8px;background:#ecfdf5;color:#047857;font-size:14px}
    .error{margin:0 0 17px;padding:11px;border-radius:8px;background:#fef2f2;color:#b91c1c;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to manage your subscriptions.</p>
    <div id="notice"></div>
    <form id="loginForm" method="post" action="/api/auth/login">
      <input type="hidden" id="csrfToken" name="_csrf">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
      <button type="submit">Sign in</button>
    </form>
    <p class="foot">Don't have an account? <a href="/register.html">Create one</a></p>
  </main>
<script>
(async()=>{
  const params=new URLSearchParams(location.search),notice=document.getElementById('notice');
  if(params.has('registered')){notice.className='notice';notice.textContent='Your account is ready. Please sign in.';}
  else if(params.has('error')){notice.className='error';notice.textContent='Invalid email or password. Please try again.';}
  else if(params.has('logout')){notice.className='notice';notice.textContent='You have been signed out.';}
  try{
    const response=await fetch('/api/auth/csrf',{cache:'no-store'});
    if(!response.ok) throw new Error('Unable to load security token');
    const csrf=await response.json();
    document.getElementById('csrfToken').value=csrf.token;
  }catch(e){notice.className='error';notice.textContent='Could not initialize secure sign-in. Refresh the page and try again.';}
})();
</script>
</body>
</html>
