<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | Subscription Box Manager</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef2ff,#f8fafc);font-family:Arial,sans-serif;color:#172033}
    .card{width:min(100%,430px);background:#fff;padding:34px;border-radius:18px;box-shadow:0 16px 45px #1e293b18}
    h1{margin:0 0 8px;font-size:27px} .sub{color:#64748b;margin:0 0 25px;line-height:1.5}
    label{display:block;font-size:14px;font-weight:600;margin:16px 0 7px}
    input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;outline:none}
    input:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f120}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}.foot{text-align:center;margin:22px 0 0;color:#64748b;font-size:14px}
    a{color:#4f46e5;text-decoration:none;font-weight:600}.message{display:none;margin-top:15px;padding:11px;border-radius:8px;font-size:14px;line-height:1.4}
    .error{display:block;background:#fef2f2;color:#b91c1c}.success{display:block;background:#ecfdf5;color:#047857}
  </style>
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <p class="sub">Sign up to manage your subscriptions in one place.</p>
    <form id="registerForm">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required maxlength="100" placeholder="Enter your name">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="150" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Re-enter your password">
      <button id="submitButton" type="submit">Create account</button>
      <div id="message" class="message" role="alert"></div>
    </form>
    <p class="foot">Already have an account? <a href="/login.html">Sign in</a></p>
  </main>
<script>
const form=document.getElementById('registerForm');
const message=document.getElementById('message');
const button=document.getElementById('submitButton');
function showMessage(text,type){message.textContent=text;message.className='message '+type;}
form.addEventListener('submit',async event=>{
  event.preventDefault(); message.className='message';
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;
  if(password!==confirmPassword){showMessage('Passwords do not match.','error');return;}
  if(password.length<8){showMessage('Password must contain at least 8 characters.','error');return;}
  button.disabled=true;button.textContent='Creating account...';
  try{
    const csrfResponse=await fetch('/api/auth/csrf',{cache:'no-store'});
    if(!csrfResponse.ok) throw new Error('Could not start a secure registration request. Please refresh and try again.');
    const csrf=await csrfResponse.json();
    const response=await fetch('/api/auth/register',{
      method:'POST',
      headers:{'Content-Type':'application/json',[csrf.headerName]:csrf.token},
      body:JSON.stringify({name,email,password})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||'Registration failed. Please try again.');
    showMessage('Account created successfully! Redirecting you to sign in...','success');
    form.reset();
    setTimeout(()=>window.location.href='/login.html?registered',1100);
  }catch(error){showMessage(error.message||'Something went wrong. Please try again.','error');}
  finally{button.disabled=false;button.textContent='Create account';}
});
</script>
</body>
</html>
